  <div id="upload-overlay" class="upload-overlay hidden" aria-hidden="true"></div>

  <div id="upload-modal" class="upload-page hidden" role="dialog" aria-modal="true" aria-labelledby="upload-title">
    <div class="upload-card">
      <button type="button" class="upload-close" aria-label="Cerrar">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>

      <h2 id="upload-title" class="upload-title">Subir archivos</h2>

      <div class="upload-tabs" role="tablist" aria-label="Tipo de subida">
        <div id="tab-indicator" class="upload-tab-indicator" aria-hidden="true"></div>
        <button class="upload-tab active" data-type="pdf" role="tab" aria-selected="true">PDF</button>
        <button class="upload-tab" data-type="excel" role="tab" aria-selected="false">Excel</button>
        <button class="upload-tab" data-type="folder" role="tab" aria-selected="false">Carpeta</button>
      </div>

      <form id="upload-form" action="{{ url_for('upload.upload_pdf') }}" method="post" enctype="multipart/form-data">
        <input id="upload-input" type="file" name="pdf" hidden accept=".pdf,application/pdf">

        <div id="drop-zone" class="drop-zone" tabindex="0">
          <i class="fa-solid fa-cloud-arrow-up drop-icon" aria-hidden="true"></i>
          <p class="drop-title">Arrastra y suelta aquí</p>
          <p id="drop-hint" class="drop-hint">Solo PDF (.pdf)</p>
          <button type="button" class="btn btn-light" id="select-files-btn">Seleccionar del dispositivo</button>
        </div>

        <div id="selected-files" class="selected-files" aria-live="polite"></div>
        <div class="upload-actions">
          <div class="upload-summary" aria-live="polite"></div>
          <button type="submit" class="btn-upload hidden" aria-label="Subir">
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </form>
    </div>
  </div>
