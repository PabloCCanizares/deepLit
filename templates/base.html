<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}deepLit{% endblock %}</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

  <!-- Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- Header / Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <a class="navbar-brand" href="{{ url_for('dashboard.dashboard') }}"><b>deepLit</b></a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav mr-auto">
              <li class="nav-item">
                  <a class="nav-link" href="{{ url_for('dashboard.dashboard') }}">Dashboard</a>
              </li>
              <li class="nav-item">
                  <a class="nav-link" href="{{ url_for('uploads.upload_pdf_page') }}">Subir PDF</a>
              </li>
              <li class="nav-item">
                  <a class="nav-link" href="{{ url_for('documents.home') }}">Documentos</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{{ url_for('uploads.upload_folder') }}">Subir Carpeta</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{{ url_for('uploads.upload_excel') }}">Subir Excel</a>
              </li>
          </ul>
          <form class="form-inline my-2 my-lg-0" action="{{ url_for('documents.search') }}" method="post">
              <input class="form-control mr-sm-2" type="search" placeholder="Buscar por título" name="query" aria-label="Buscar" value="{{ query or '' }}">
              <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Buscar</button>
          </form>
      </div>
  </nav>
  <!-- Contenido principal -->
  <div class="container mt-4">
    {% block content %}{% endblock %}
  </div>
  <!-- Footer -->
  <footer class="bg-light text-center py-3">
      <div class="container">
          <span class="text-muted">© 2024 <b>deepLit</b>. All rights non-reserved.</span>
      </div>
  </footer>
  {% block extra_js %}{% endblock %}
</body>
</html>
