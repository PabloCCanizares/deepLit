{% extends "base.html" %}
{% block title %}Subir Excel - Gestor de Documentos{% endblock %}
{% block content %}
<div class="container my-4">
  <h1>Subir Excel</h1>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="alert alert-warning">
        {% for message in messages %}
          <p>{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  <form action="{{ url_for('uploads.upload_excel') }}" method="post" enctype="multipart/form-data">
    <div class="form-group">
      <label for="excel">Selecciona el archivo Excel (XLSX):</label>
      <input type="file" name="excel" id="excel" class="form-control-file" accept=".xlsx,.xls" required>
    </div>
    <button type="submit" class="btn btn-primary">Subir Excel</button>
  </form>
</div>
{% endblock %}
